name: Refresh subway map data

# MTA publishes a new static GTFS file every few weeks. This job rebuilds the
# station catalog, transfer table and map geometry from it, runs the tests,
# and opens a pull request for the group to review. Nothing is merged
# automatically.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the official MTA subway GTFS
        run: curl -fsSL --retry 3 -o gtfs_subway.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
      - name: Rebuild reference data
        run: python3 scripts/build-map-data.py gtfs_subway.zip
      - run: rm gtfs_subway.zip
      - run: npm ci
      - name: Tests must still pass with the new data
        run: npm test
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh-map
          delete-branch: true
          commit-message: "data: refresh station catalog and map from MTA GTFS"
          title: "Refresh subway map data from MTA GTFS"
          body: |
            Automated weekly rebuild of `public/stations.json`, `public/subway-map.json`
            and `lib/transit/map-data.json` from https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip.
            Tests passed in the workflow. Review the station count and any renamed stations before merging.
