name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and property tests
        run: npm test
      - name: Production build and type check
        run: npm run build
      - name: Local HTTP smoke test
        run: npm run test:smoke
      - name: Dependency audit (fail on high or critical)
        run: npm audit --audit-level=high
